[package]
name = "unblurt"
version = "0.1.0"
description = "messy thoughts. clear writing."
edition = "2021"

[lib]
name = "unblurt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only ever talks to the local opencode server, so no TLS stack is needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["process", "time", "sync", "macros"] }
arboard = "3"
enigo = "0.6"

# Remember and re-activate the app you came from, without hiding unblurt's other windows (the plate).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSWorkspace", "NSRunningApplication"] }
