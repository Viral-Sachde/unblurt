<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,sans-serif;background:#F6F2EC;color:#101010;width:1600px;padding:64px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px}
h1{font-size:64px;font-weight:500;letter-spacing:-.04em;line-height:.95}
.label{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#57534d}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.card{display:flex;flex-direction:column;background:#fff;border-radius:20px;overflow:hidden;border:1px solid rgba(16,16,16,.08)}
.hero{background:#EDE6DD;height:280px;display:grid;place-items:center}
.hero img{width:180px;height:180px}
.meta{padding:18px 20px 8px}
.meta b{font-size:12px;letter-spacing:.08em;color:#FF7A45}
.meta h2{font-size:24px;font-weight:600;letter-spacing:-.03em;margin:4px 0 6px}
.meta p{font-size:14px;line-height:1.4;color:#57534d;min-height:60px}
.sizes{display:flex;align-items:flex-end;gap:14px;padding:12px 20px}
.dark{margin-top:auto;background:#101010;display:flex;align-items:center;gap:14px;padding:20px}
.lock{display:flex;align-items:center;gap:10px;padding:20px;border-top:1px solid rgba(16,16,16,.08)}
.lock span{font-size:30px;font-weight:600;letter-spacing:-.045em}
.dark span{color:#FBF8F4;font-size:24px;font-weight:600;letter-spacing:-.045em}
</style></head><body>
<header><h1>unblurt<br>logo explorations</h1><span class="label">round three · caret, five iterations</span></header>
<div class="grid" id="g"></div>
<script>
const C=[["07a","Clean","Stripped to the idea: one selection, one cursor. Most legible at 16px and in the menu bar."],
["07b","Night","Teal tile, cream cursor. Same content as the original caret, but it stands out in a light dock and matches the site buttons."],
["07c","Selected u","A u whose right stroke is the text cursor, sitting on a highlight. Monogram and selection in one shape."],
["07d","Before / after","A wavy messy line on top, a clean highlighted line below. The whole product story in one icon."],
["07e","Bare","No tile: just the highlight pill and a tall cursor. Sits next to the wordmark like a logotype."]];
const files=["07a-caret-clean","07b-caret-night","07c-caret-u","07d-caret-before-after","07e-caret-mark"];
g.innerHTML=C.map(([n,t,d],i)=>{const f=files[i]+".svg";return `<div class="card"><div class="hero"><img src="${f}"></div>
<div class="meta"><b>${n}</b><h2>${t}</h2><p>${d}</p></div>
<div class="sizes">${[64,40,24,16].map(s=>`<img src="${f}" width="${s}" height="${s}">`).join("")}</div>
<div class="lock"><img src="${f}" width="40" height="40"><span>unblurt</span></div>
<div class="dark"><img src="${f}" width="36" height="36"><span>unblurt</span></div></div>`}).join("");
</script></body></html>
