<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;font-family:Inter,sans-serif;background:#EDE6DD;color:#101010;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(16,16,16,.12) 1.6px,transparent 1.8px);background-size:26px 26px}
.left{position:absolute;left:72px;top:64px;bottom:64px;width:500px;z-index:1;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:600;letter-spacing:-.045em}
.logo img{width:52px;height:52px}
h1{margin-top:auto;font-size:84px;line-height:.92;font-weight:500;letter-spacing:-.055em}
h1 em{font-style:normal;color:#0F6B6A}
p{margin-top:26px;font-size:24px;line-height:1.35;color:#57534d;letter-spacing:-.01em;max-width:480px}
.keys{display:flex;gap:10px;margin-top:30px}
kbd{font-family:inherit;font-size:22px;font-weight:500;background:#FBF8F4;border-radius:12px;padding:10px 18px;box-shadow:0 4px 0 #DDD3C6}
kbd.o{background:#FF7A45;color:#101010;box-shadow:0 4px 0 #E25F2A}
.art{position:absolute;right:16px;top:110px;width:720px}
.label{position:absolute;right:72px;top:74px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#57534d}
</style></head><body>
<div class="dots"></div>
<img class="art" src="product-message.png">

<div class="left">
  <div class="logo"><img src="../mark.svg">unblurt</div>
  <h1>messy thoughts.<br><em>clear writing.</em></h1>
  <p>Select text anywhere, press one shortcut, get it back written properly.</p>
</div>
</body></html>
